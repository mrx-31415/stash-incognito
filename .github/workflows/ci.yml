name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install --quiet pytest==8.4.2
      - run: for f in */*.js; do node --check "$f"; done
      - run: python -m pytest -q tests --ignore=tests/integration
      - run: python scripts/build.py --dev

  integration:
    # A throwaway Stash in Docker with the plugin built from this commit, one
    # synthetic clip, and Playwright driving Stash's own scene page.
    name: Integration (Stash ${{ matrix.stash }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stash: [v0.31.1, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r tests/integration/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/integration/requirements.txt') }}
      - run: python -m playwright install --only-shell chromium
      - run: scripts/integration
        env:
          STASH_IMAGE: stashapp/stash:${{ matrix.stash }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-${{ matrix.stash }}
          path: test-results/
          retention-days: 7
