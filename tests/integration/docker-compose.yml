services:
  stash:
    image: ${STASH_IMAGE:-stashapp/stash:v0.31.1}
    ports:
      - "${STASH_PORT:-9999}:9999"
    environment:
      STASH_CONFIG_FILE: /root/.stash/config.yml
    volumes:
      - "${STASH_CONFIG:?}:/root/.stash"
      - "${STASH_MEDIA:?}:/media"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
